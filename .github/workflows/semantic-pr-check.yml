name: Semantic PR Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! scripts/ci/classify-pr-title.sh "$PR_TITLE" > /dev/null; then
            echo "PR title must start with feat, fix, docs, style, refactor, perf, test, build, ci, chore, or revert, optionally with a (scope) and !"
            echo "Example: feat: add the mission builder"
            exit 1
          fi
