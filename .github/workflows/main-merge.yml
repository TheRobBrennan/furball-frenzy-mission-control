name: Main Branch Merge

# A merge to main bumps the version from the PR title, merges the bump, then starts Deploy Production,
# which deploys to the Oracle Cloud VM and checks the public site. Modeled on the hockey analytics workflow, see
# docs/deployment/oracle-vm.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One run at a time. Two PRs merged back to back each start a run, and the second version bump used to
# be made from an older main, so it conflicted with the first (2026-11-15). Runs now queue, and each bump
# is made from the latest main.
concurrency:
  group: main-merge
  cancel-in-progress: false

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.get_pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The latest main, not the commit that triggered this run, so a queued run bumps on top of the
          # bump an earlier run already merged. The PR title still comes from the triggering commit.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git for GitHub Actions
        run: |
          git config --global user.name "Rob Brennan"
          git config --global user.email "rob@sploosh.ai"

      - name: Determine version bump type
        id: bump-type
        run: |
          # A merge commit holds the PR title on its third line. A squash commit holds it on the
          # first line, followed by " (#123)".
          COMMIT_MSG=$(git log --format=%B -n 1 ${{ github.sha }})
          PR_TITLE=$(echo "$COMMIT_MSG" | sed -n '3p')
          if ! scripts/ci/classify-pr-title.sh "$PR_TITLE" >/dev/null; then
            PR_TITLE=$(echo "$COMMIT_MSG" | sed -n '1p' | sed -E 's/ \(#[0-9]+\)$//')
          fi
          echo "PR title: $PR_TITLE"
          if ! BUMP=$(scripts/ci/classify-pr-title.sh "$PR_TITLE"); then
            echo "Invalid PR title format: $PR_TITLE"
            exit 1
          fi
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Create version bump branch
        id: create_branch
        run: |
          BRANCH_NAME="version-bump-${{ github.sha }}"
          git checkout -b "$BRANCH_NAME"

          OLD_VERSION=$(jq -r .version package.json)
          echo "old_version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"

          BUMP_TYPE=${{ steps.bump-type.outputs.type }}
          IFS=. read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
          case "$BUMP_TYPE" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            *)     NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          # The root and the web app carry the same version
          for f in package.json apps/web/package.json; do
            jq ".version = \"$NEW_VERSION\"" "$f" > temp.json && mv temp.json "$f"
          done

          git add package.json apps/web/package.json
          git commit -m "chore: bump version from ${OLD_VERSION} to ${NEW_VERSION} [skip ci]"
          git push --force-with-lease origin "$BRANCH_NAME" || git push --force origin "$BRANCH_NAME"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create or update the pull request
        id: get_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.create_branch.outputs.branch_name }}"
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number,url -q '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | grep -o '[0-9]*$')
          else
            PR_URL=$(gh pr create \
              --title "chore: bump version from ${{ steps.create_branch.outputs.old_version }} to ${{ steps.create_branch.outputs.new_version }}" \
              --body "Automated version bump triggered by a merge to main. Updates the version in both package.json files." \
              --base main \
              --head "$BRANCH_NAME")
            PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  merge-pr:
    needs: version-bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for checks and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ needs.version-bump.outputs.pr_number }}
          timeout=600
          while [ $timeout -gt 0 ]; do
            STATUSES=$(gh pr view "$PR" --json statusCheckRollup --jq '.statusCheckRollup.[].state')
            if echo "$STATUSES" | grep -q "PENDING"; then
              sleep 10; timeout=$((timeout - 10)); continue
            fi
            if echo "$STATUSES" | grep -q "FAILURE"; then
              echo "Some checks failed"; exit 1
            fi
            BRANCH_NAME=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
            gh pr merge "$PR" --merge
            git push origin --delete "$BRANCH_NAME"
            exit 0
          done
          echo "Timeout waiting for checks"
          exit 1

  # A version-bump merge made with GITHUB_TOKEN does not trigger workflows, so production is started
  # from here once that merge is in. workflow_dispatch is the exception GitHub allows, and it gives the
  # deploy its own run in the Actions list.
  start-production-deploy:
    name: Start Deploy Production
    needs: merge-pr
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the Deploy Production workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-production.yml --ref main --repo "$GITHUB_REPOSITORY"
