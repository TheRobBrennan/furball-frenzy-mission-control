# Furball Frenzy: Mission Control, web (Next.js) plus api (FastAPI).
# Run from the repo root with `make up`.
name: furball-frenzy

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        API_URL: http://api:8000
        GIT_HASH: ${GIT_HASH:-dev}
        BUILD_TIME: ${BUILD_TIME:-dev}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
