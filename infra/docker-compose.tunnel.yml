# Cloudflare Tunnel overlay, strictly additive. Layer it ON TOP of docker-compose.yml with an
# extra -f flag (scripts/deploy/deploy-to-oracle.sh does). The plain `npr start` path stays
# localhost-only and tunnel-free.
#
# What this changes:
#   - adds the cloudflared service (profile "tunnel", so it never starts by accident)
#   - drops both host port mappings. The tunnel reaches the web app by its compose service name
#     over the internal network, so nothing listens on the VM's host at all. On the shared
#     Oracle VM that matters, other projects hold host ports and the stacks must not collide.
#   - adds a healthcheck to web, so cloudflared starts only once the app is serving
#
# Requires infra/cloudflared/credentials.json next to this file on the VM, created by
# `npr deploy:tunnel`, see docs/deployment/cloudflare-tunnel.md.

services:
  api:
    # Compose concatenates list fields across -f files. `!reset` replaces instead of merging.
    ports: !reset []

  web:
    ports: !reset []
    healthcheck:
      # The slim Node image has no curl or wget, Node 24 has fetch built in.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    # The Service URL is the compose service name, not localhost. localhost would point at the
    # cloudflared container itself.
    command: >
      tunnel --no-autoupdate run
      --credentials-file /etc/cloudflared/credentials.json
      --url http://web:3000
      ${TUNNEL_ID:?set TUNNEL_ID in .env.deploy, see docs/deployment/cloudflare-tunnel.md}
    # The image's default user (65532) maps to a sub-uid that cannot read the credentials file,
    # which is mode 600 and owned by the deploy user. Root inside the rootless user namespace IS
    # the deploy user on the host, so it can read the file and has no extra power on the VM.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    labels:
      ai.sploosh.application: "cloudflared"
      ai.sploosh.project: "furball-frenzy-mission-control"
      ai.sploosh.environment: "production"
